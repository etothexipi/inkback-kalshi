[package]
name = "InkBack"
version = "0.1.0"
edition = "2021"

[dependencies]
databento = "0.8.0"
time = "0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dotenvy = "0.15"
csv = "1.3"
rayon = "1.8"
serde = "1.0.219"
iced = { version = "0.12", features = ["canvas", "tokio"] }
serde_json = "1.0"

# Kalshi integration
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.21"
rsa = "0.9"
sha2 = "0.10"
rand = "0.8"
openssl = { version = "0.10" }
